name: Playwright E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: mvn -B -pl wortsuche-web -am package
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Add test summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const resultsPath = 'test-results/results.json';

          if (!fs.existsSync(resultsPath)) {
            fs.appendFileSync(summaryPath, '## Playwright E2E report\n\nTests did not run; check the preceding build and setup steps.\n');
          } else {
            const { stats } = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const rows = [
              ['Passed', stats.expected],
              ['Failed', stats.unexpected],
              ['Flaky', stats.flaky],
              ['Skipped', stats.skipped],
            ];
            const table = rows.map(([label, count]) => `| ${label} | ${count} |`).join('\n');
            fs.appendFileSync(summaryPath, `## Playwright E2E report\n\n| Result | Count |\n| --- | ---: |\n${table}\n\n[Open this run to download the detailed HTML report](${process.env.RUN_URL})\n`);
          }
          NODE
      - name: Upload Playwright report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
