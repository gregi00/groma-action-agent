name: Groma PR comparison

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: PR number to compare after review
        required: true
        type: number
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pull.outputs.number }}
      base: ${{ steps.pull.outputs.base }}
      is-private: ${{ steps.pull.outputs.is-private }}
      has-architecture: ${{ steps.groma-baseline.outputs.available }}
    steps:
      - name: Select the pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull-request || github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '"number=\(.number)\nbase=\(.base.sha)\nhead=\(.head.sha)\nis-private=\(.base.repo.private)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pull.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for an existing Groma baseline
        id: groma-baseline
        env:
          BASE: ${{ steps.pull.outputs.base }}
        run: |
          if ! git cat-file -e "$BASE:groma/index.md" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif git ls-tree -r --name-only "$BASE" -- groma/systems | grep -Eq '^groma/systems/[^/]+\.md$'; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Find the PR comparison base
        id: commits
        if: steps.groma-baseline.outputs.available == 'true'
        env:
          BASE: ${{ steps.pull.outputs.base }}
          HEAD: ${{ steps.pull.outputs.head }}
        run: |
          git fetch --no-tags origin "$HEAD"
          echo "from=$(git merge-base "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
      - name: Ensure Groma scanner configuration
        if: steps.groma-baseline.outputs.available == 'true'
        run: |
          if [ ! -f groma/scanners.json ]; then
            printf '{\n  "scanners": []\n}\n' > groma/scanners.json
          fi
      - uses: MrLesk/groma.md-action@v1
        id: map
        if: steps.groma-baseline.outputs.available == 'true'
        with:
          groma-version: '0.6.6'
          from: ${{ steps.commits.outputs.from }}
          revision: ${{ steps.pull.outputs.head }}
      - uses: actions/upload-artifact@v4
        if: steps.groma-baseline.outputs.available == 'true'
        with:
          name: groma-comparison
          path: ${{ steps.map.outputs.output }}
          retention-days: 30

  publish:
    needs: compare
    if: needs.compare.outputs.has-architecture == 'true' && needs.compare.outputs.is-private != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    concurrency:
      group: groma-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: groma-comparison
          path: comparison
      - uses: MrLesk/groma.md-action/publish@v1
        id: preview
        with:
          pull-request: ${{ needs.compare.outputs.number }}
          base: ${{ needs.compare.outputs.base }}
          directory: comparison
          token: ${{ github.token }}

  comment-private-comparison:
    needs: compare
    if: needs.compare.result == 'success' && needs.compare.outputs.has-architecture == 'true' && needs.compare.outputs.is-private == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: groma-comparison
          path: comparison
      - name: Comment the architecture summary and link the private diff
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.compare.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SUMMARY=comparison/architecture/auto/comparison.json
          FROM=$(jq -er '.from | select(test("^[a-f0-9]{40}$"))' "$SUMMARY")
          REVISION=$(jq -er '.revision | select(test("^[a-f0-9]{40}$"))' "$SUMMARY")
          COMPONENTS=$(jq -er '.components | select([.added, .modified, .removed] | all(.[]; type == "number")) | "| Components | \(.added) | \(.modified) | \(.removed) |"' "$SUMMARY")
          RELATIONSHIPS=$(jq -er '.relationships | select([.added, .modified, .removed] | all(.[]; type == "number")) | "| Relationships | \(.added) | \(.modified) | \(.removed) |"' "$SUMMARY")
          BODY=$(printf '<!-- groma-comparison -->\n### Groma architecture comparison\n\nThis repository is private, so GitHub Pages preview publishing is unavailable. The complete interactive before/after map is attached as a workflow artifact (available to repository members for 30 days).\n\n| Changes | Added | Modified | Removed |\n| --- | ---: | ---: | ---: |\n%s\n%s\n\n[Download the Groma comparison artifact](%s/%s/actions/runs/%s)\n\nCompared [`%s`](%s/%s/commit/%s) (merge base) with [`%s`](%s/%s/commit/%s).' \
            "$COMPONENTS" \
            "$RELATIONSHIPS" \
            "$GITHUB_SERVER_URL" "$REPOSITORY" "$RUN_ID" \
            "${FROM:0:7}" "$GITHUB_SERVER_URL" "$REPOSITORY" "$FROM" \
            "${REVISION:0:7}" "$GITHUB_SERVER_URL" "$REPOSITORY" "$REVISION")
          COMMENT_ID=$(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- groma-comparison -->"))) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPOSITORY/issues/comments/$COMMENT_ID" --method PATCH -f body="$BODY"
          else
            gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --method POST -f body="$BODY"
          fi

  explain-unavailable-baseline:
    needs: compare
    if: needs.compare.result == 'success' && needs.compare.outputs.has-architecture != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Explain why this pull request has no architecture diff
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.compare.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --method POST \
            -f body='Groma could not compare this pull request because the base branch has no compatible architecture baseline (it is missing `groma/index.md` or contains system documents outside the canonical `groma/systems/<system-id>/system.md` paths). This pull request establishes a valid baseline; subsequent pull requests will include the before/after architecture map and change summary.'
